name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@4883fca0ea86 # main @ 2026-11-12
    with:
      tier: b            # ≥80% line coverage; execution, assertion, and determinism suites
      all-features: true
      loom: false        # n/a — no lock-free shared-memory primitives (recorded; graduates to true with Tier A when they land)
      wasm: false        # n/a — the harness is the native host runtime; guests are fed as bytes
      miri: false        # n/a — forbid(unsafe_code); no FFI
